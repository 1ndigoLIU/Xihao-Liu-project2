<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudoku Arcade — Login</title>

    <!-- Preload font -->
    <link rel="preload" href="../assets/fonts/cheltenham-normal-300.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Favicon -->
    <link rel="icon" href="../assets/img/Sudoku.svg" type="image/svg+xml">

    <!-- CSS: common first, then page-specific -->
    <link rel="stylesheet" href="../assets/css/common.css" />
    <link rel="stylesheet" href="login.css" />
</head>
<body>
<!-- Top navbar -->
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="../">Sudoku Arcade</a>
        <nav class="site-nav" aria-label="Primary">
            <ul class="nav-list">
                <li><a href="../">Home</a></li>
                <li><a href="../selection/">Selection</a></li>
                <li><a href="../game-hard/">Hard</a></li>
                <li><a href="../game-easy/">Easy</a></li>
                <li><a href="../rules/">Rules</a></li>
                <li><a href="../high-scores/">High Scores</a></li>
                <li><a class="active" href="./">Login</a></li>
                <li><a href="../register/">Register</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <section class="page-head">
        <h1 class="page-title">Login</h1>
        <p class="lead">Sign in to continue.</p>
    </section>

    <!-- Simple mock form (no real submission) -->
    <section class="auth">
        <form class="form" action="#" method="post" aria-label="Login form">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="yourname" />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="••••••••" />
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <p class="hint">
            Don’t have an account?
            <a href="../register/">Create one</a>.
        </p>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <p>© 2025 Sudoku Arcade · CS5610 Web Development · by Xihao Liu</p>
    </div>
</footer>
</body>
</html>
