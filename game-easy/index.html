<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudoku Arcade — Sudoku Easy 6×6</title>

    <!-- Preload font -->
    <link rel="preload" href="../assets/fonts/cheltenham-normal-300.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Favicon -->
    <link rel="icon" href="../assets/img/Sudoku.svg" type="image/svg+xml">

    <!-- CSS: common first, then page-specific -->
    <link rel="stylesheet" href="../assets/css/common.css" />
    <link rel="stylesheet" href="game-easy.css" />
</head>
<body>
<!-- Top navbar -->
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="../">Sudoku Arcade</a>
        <nav class="site-nav" aria-label="Primary">
            <ul class="nav-list">
                <li><a href="../">Home</a></li>
                <li><a href="../selection/">Selection</a></li>
                <li><a href="../game-hard/">Hard</a></li>
                <li><a class="active" href="./">Easy</a></li>
                <li><a href="../rules/">Rules</a></li>
                <li><a href="../high-scores/">High Scores</a></li>
                <li><a href="../login/">Login</a></li>
                <li><a href="../register/">Register</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <section class="page-head">
        <h1 class="page-title">Sudoku Easy — 6×6</h1>
        <!-- Fake timer (static text only) -->
        <div class="timer" aria-label="Timer">Time: <strong>00:21</strong></div>
    </section>

    <!-- 6×6 board with some given (disabled) cells; subgrids are 2×3 -->
    <div class="board-wrap">
        <table class="board" role="grid" aria-label="Sudoku 6 by 6 board">
            <tbody>
            <!-- Row 1 -->
            <tr>
                <td><input aria-label="r1c1" class="given" type="number" value="3" disabled></td>
                <td><input aria-label="r1c2" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r1c3" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r1c4" class="given" type="number" value="5" disabled></td>
                <td><input aria-label="r1c5" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r1c6" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
            </tr>
            <!-- Row 2 -->
            <tr>
                <td><input aria-label="r2c1" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r2c2" class="given" type="number" value="1" disabled></td>
                <td><input aria-label="r2c3" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r2c4" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r2c5" class="given" type="number" value="4" disabled></td>
                <td><input aria-label="r2c6" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
            </tr>
            <!-- Row 3 -->
            <tr>
                <td><input aria-label="r3c1" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r3c2" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r3c3" class="given" type="number" value="6" disabled></td>
                <td><input aria-label="r3c4" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r3c5" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r3c6" class="given" type="number" value="2" disabled></td>
            </tr>
            <!-- Row 4 -->
            <tr>
                <td><input aria-label="r4c1" class="given" type="number" value="2" disabled></td>
                <td><input aria-label="r4c2" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r4c3" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r4c4" class="given" type="number" value="1" disabled></td>
                <td><input aria-label="r4c5" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r4c6" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
            </tr>
            <!-- Row 5 -->
            <tr>
                <td><input aria-label="r5c1" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r5c2" class="given" type="number" value="5" disabled></td>
                <td><input aria-label="r5c3" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r5c4" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r5c5" class="given" type="number" value="3" disabled></td>
                <td><input aria-label="r5c6" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
            </tr>
            <!-- Row 6 -->
            <tr>
                <td><input aria-label="r6c1" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r6c2" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r6c3" class="given" type="number" value="4" disabled></td>
                <td><input aria-label="r6c4" class="given" type="number" value="6" disabled></td>
                <td><input aria-label="r6c5" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
                <td><input aria-label="r6c6" type="number" min="1" max="6" step="1" inputmode="numeric" placeholder=" "></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <p>© 2025 Sudoku Arcade · CS5610 Web Development · by Xihao Liu</p>
    </div>
</footer>
</body>
</html>
